name: Build ALEXVID Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APKs
        run: gradle assembleRelease --stacktrace

      - name: Prepare renamed APKs
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            if [[ "$base" == *"universal"* ]]; then
              cp "$apk" "dist/ALEXVID-universal.apk"
            elif [[ "$base" == *"arm64-v8a"* ]]; then
              cp "$apk" "dist/ALEXVID-arm64-v8a.apk"
            elif [[ "$base" == *"armeabi-v7a"* ]]; then
              cp "$apk" "dist/ALEXVID-armeabi-v7a.apk"
            elif [[ "$base" == *"x86_64"* ]]; then
              cp "$apk" "dist/ALEXVID-x86_64.apk"
            fi
          done
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALEXVID-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-latest
          name: "ALEXVID v1.2.0 — Android APK"
          body: |
            ### ALEXVID v1.2.0 — Универсальный видеоплеер для Android

            **Новое в v1.2.0 (Полноценный экран настроек ⚙):**
            - Полноценный экран настроек, доступный из главного экрана (⚙ сверху) и прямо из плеера (⚙ в верхней панели).
            - **Воспроизведение**: продолжение с места остановки, автопереход к следующему видео, скорость по умолчанию, шаг быстрой перемотки (`5–60 сек`), ориентация экрана, соотношение сторон по умолчанию, фоновое воспроизведение звука, не выключать экран.
            - **Видео и звук**: аппаратное / FFmpeg декодирование, деинтерлейсинг (для IPTV/TS/DVD), усиление звука до 200%, сохранение тембра (Time-Stretch), задержка звука (`-500..+500 мс` для Bluetooth-наушников).
            - **Жесты и интерфейс**: индивидуальное включение/выключение каждого жеста, таймаут автоскрытия кнопок, справка по жестам.
            - **Субтитры**: автопоиск файлов, размер, цвет, **кодировка Windows-1251 / UTF-8**, прозрачность подложки.
            - **Сеть и скриншоты**: сетевой буфер (`500–10000 мс`), автопереподключение, User-Agent по умолчанию, формат скриншотов **PNG / JPEG**, вспышка затвора и сброс настроек.

            **Режим обзора фильмов:**
            - **Покадровый просмотр** (`−1 кадр` / `+1 кадр`, удержание для плавного листания, `−1с` / `+1с`, точный таймкод с миллисекундами и FPS).
            - **Режим Зума и смещения (до 8.0x)** — при включении кнопки 🔍 обычные жесты плеера полностью отключаются; увеличение пальцами в нужную область и свободное перетаскивание кадра.
            - **Скриншоты в Галерею (`Pictures/ALEXVID`)** — чистый кадр без кнопок интерфейса; в режиме зума сохраняет приближённую область экрана.

            **Какой APK скачать:**
            - `ALEXVID-arm64-v8a.apk` — для большинства современных смартфонов Android (меньше размер).
            - `ALEXVID-universal.apk` — универсальный APK для любых устройств Android (смартфоны, планшеты, Android TV).
          files: dist/*.apk
          make_latest: true
          overwrite_files: true
