name: Build ALEXVID Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APKs
        run: gradle assembleRelease --stacktrace

      - name: Prepare renamed APKs
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            if [[ "$base" == *"universal"* ]]; then
              cp "$apk" "dist/ALEXVID-universal.apk"
            elif [[ "$base" == *"arm64-v8a"* ]]; then
              cp "$apk" "dist/ALEXVID-arm64-v8a.apk"
            elif [[ "$base" == *"armeabi-v7a"* ]]; then
              cp "$apk" "dist/ALEXVID-armeabi-v7a.apk"
            elif [[ "$base" == *"x86_64"* ]]; then
              cp "$apk" "dist/ALEXVID-x86_64.apk"
            fi
          done
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALEXVID-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-latest
          name: "ALEXVID v1.3.0 — Android APK"
          body: |
            ### ALEXVID v1.3.0 — Универсальный видеоплеер для Android

            **Новое в v1.3.0:**
            - **Добавление видео из Галереи** — кнопка **«+ Добавить видео» → «Добавить видео из Галереи»** позволяет выбрать одно или сразу несколько видео прямо из Галереи (они сохраняются в папке **«Из галереи»** внутри ALEXVID, работают даже без выдачи доступа ко всей памяти; долгое нажатие убирает из списка без удаления файла). Также добавлена поддержка **«Поделиться видео → ALEXVID»** прямо из Галереи!
            - **Контроль памяти и кэша (Настройки → Память и кэш)** — отображение реального размера кэша, очистка в 1 клик и автоочистка временных файлов субтитров при выходе. Потоковое онлайн-видео буферизуется только в RAM (кольцевой буфер) и не забивает память телефона.

            **Основные возможности:**
            - Все форматы видео и аудио (MKV, MP4, AVI, MOV, FLV, WMV, WebM, TS, VOB, HEVC, AV1, AC3, DTS) на движке LibVLC 3.6.2.
            - **Режим обзора фильмов**: Зум и смещение до **8.0x** (с отключением обычных жестов), покадровый просмотр (`±1 кадр`, `±1с`, FPS, мс), чистые скриншоты видимой области в Галерею (`Pictures/ALEXVID`).
            - Субтитры (встроенные + внешние `.srt`/`.ass`/`.vtt`/`.sub`, задержка, кодировка `Windows-1251/UTF-8`, размер, цвет, фон).
            - Онлайн-потоки (HLS `.m3u8`, DASH `.mpd`, RTSP, RTMP, HTTP/HTTPS, User-Agent, Referer) + полноценный экран настроек ⚙.

            **Какой APK скачать:**
            - `ALEXVID-arm64-v8a.apk` — для большинства современных смартфонов Android (меньше размер).
            - `ALEXVID-universal.apk` — универсальный APK для любых устройств Android (смартфоны, планшеты, Android TV).
          files: dist/*.apk
          make_latest: true
          overwrite_files: true
